<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo especial para ustedes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
            background-color: #fce7e9;
            background-image: radial-gradient(#e5a8ab 0.8px, transparent 0.8px), radial-gradient(#e5a8ab 0.8px, #fce7e9 0.8px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            overflow-x: hidden;
        }
        .retro-font {
            font-family: 'Special Elite', cursive;
        }
        .card-shadow {
            box-shadow: 0 25px 35px -5px rgba(43, 27, 23, 0.15), 0 10px 15px -5px rgba(43, 27, 23, 0.08), inset 0 0 50px rgba(255,255,255,0.4);
        }
        @keyframes float {
            0% { transform: translateY(0vh) rotate(0deg) scale(0.9); opacity: 0.15; }
            50% { opacity: 0.35; transform: translateY(-55vh) rotate(180deg) scale(1.1); }
            100% { transform: translateY(-110vh) rotate(360deg) scale(0.9); opacity: 0.15; }
        }
        .floating-emoji {
            position: absolute;
            bottom: -15vh;
            user-select: none;
            pointer-events: none;
            animation: float linear infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(232, 121, 121, 0.4)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(232, 121, 121, 0.8)); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="floating-emoji text-3xl" style="left: 6%; animation-duration: 15s; animation-delay: 0s;">🥰</div>
        <div class="floating-emoji text-4xl" style="left: 18%; animation-duration: 19s; animation-delay: 2s;">💖</div>
        <div class="floating-emoji text-3xl" style="left: 30%; animation-duration: 13s; animation-delay: 4s;">😍</div>
        <div class="floating-emoji text-4xl" style="left: 42%; animation-duration: 17s; animation-delay: 1s;">✨</div>
        <div class="floating-emoji text-3xl" style="left: 55%; animation-duration: 14s; animation-delay: 3s;">😘</div>
        <div class="floating-emoji text-4xl" style="left: 68%; animation-duration: 18s; animation-delay: 5s;">😊</div>
        <div class="floating-emoji text-2xl" style="left: 80%; animation-duration: 12s; animation-delay: 2.5s;">💘</div>
        <div class="floating-emoji text-3xl" style="left: 90%; animation-duration: 16s; animation-delay: 1.5s;">🥰</div>
        <div class="floating-emoji text-2xl" style="left: 12%; animation-duration: 20s; animation-delay: 6s;">💫</div>
        <div class="floating-emoji text-3xl" style="left: 62%; animation-duration: 15s; animation-delay: 4.5s;">😍</div>
        <div class="floating-emoji text-3xl" style="left: 24%; animation-duration: 14s; animation-delay: 3.5s;">😘</div>
        <div class="floating-emoji text-4xl" style="left: 76%; animation-duration: 16s; animation-delay: 0.5s;">💖</div>
    </div>

    <div id="app" class="w-full max-w-md mx-auto relative z-10">
        
        <!-- CARD 1 -->
        <div id="card1" class="bg-[#fff5f5] border-4 border-[#2b1b17] rounded-3xl p-6 sm:p-8 card-shadow relative overflow-hidden transition-all duration-700 transform scale-100 opacity-100">
            <!-- Decorative corner elements -->
            <div class="absolute top-4 left-4 text-xl text-[#2b1b17]">♥</div>
            <div class="absolute top-4 right-4 text-xl text-[#2b1b17]">♥</div>
            <div class="absolute bottom-4 left-4 text-xl text-[#2b1b17]">♥</div>
            <div class="absolute bottom-4 right-4 text-xl text-[#2b1b17]">♥</div>

            <!-- Inner Border Line with vintage aesthetic -->
            <div class="border-2 border-[#2b1b17] rounded-2xl p-6 sm:p-8 flex flex-col items-center text-center relative bg-gradient-to-b from-[#fffaf9] to-[#fcedec]">
                
                <!-- Sparkles & Central Animated Heart -->
                <div class="mb-5 relative">
                    <div class="text-5xl text-[#e87979] animate-pulse-glow">♥</div>
                    <div class="absolute -top-3 -left-7 text-lg animate-bounce">✨</div>
                    <div class="absolute -top-3 -right-7 text-lg animate-bounce">✨</div>
                </div>

                <!-- Headings -->
                <h1 class="text-3xl sm:text-4xl font-extrabold text-[#2b1b17] tracking-tight leading-tight mb-3">
                    Tenemos algo especial para ustedes
                </h1>
                
                <div class="w-28 h-[2px] bg-[#2b1b17] my-3 relative">
                    <span class="absolute left-1/2 -top-2 transform -translate-x-1/2 text-xs text-[#e87979]">♥</span>
                </div>

                <p class="retro-font text-sm sm:text-base text-[#432c25] mt-2 mb-8 px-2">
                    Solo queríamos sacarles una sonrisa 😊
                </p>

                <!-- Next Button -->
                <button onclick="showCard2()" class="mt-2 bg-[#2b1b17] text-[#fcedec] px-8 py-3.5 rounded-full font-bold text-sm tracking-wider hover:bg-[#432c25] transition-all transform hover:scale-105 shadow-lg flex items-center gap-3 group cursor-pointer">
                    <span>Siguiente</span> <span class="group-hover:translate-x-1 transition-transform">→</span>
                </button>
            </div>
        </div>

        <!-- CARD 2 (Initially Hidden) -->
        <div id="card2" class="hidden bg-[#fff5f5] border-4 border-[#2b1b17] rounded-3xl p-6 sm:p-8 card-shadow relative overflow-hidden transition-all duration-700 transform scale-95 opacity-0">
            <!-- Decorative corner elements -->
            <div class="absolute top-4 left-4 text-xl text-[#2b1b17]">♥</div>
            <div class="absolute top-4 right-4 text-xl text-[#2b1b17]">♥</div>
            <div class="absolute bottom-4 left-4 text-xl text-[#2b1b17]">♥</div>
            <div class="absolute bottom-4 right-4 text-xl text-[#2b1b17]">♥</div>

            <!-- Inner Border Line -->
            <div class="border-2 border-dashed border-[#2b1b17] rounded-2xl p-6 sm:p-8 flex flex-col items-center text-center relative bg-gradient-to-b from-[#fffaf9] to-[#fcedec]">
                
                <!-- Sparkles & Central Heart -->
                <div class="mb-3 relative">
                    <div class="text-4xl text-[#e87979] animate-pulse-glow">♥</div>
                    <div class="absolute -top-3 -left-7 text-sm">✨</div>
                    <div class="absolute -top-3 -right-7 text-sm">✨</div>
                </div>

                <!-- Headings -->
                <h2 class="text-3xl sm:text-4xl font-extrabold text-[#2b1b17] tracking-tight leading-tight mb-2">
                    Nos gustaría conocerlas
                </h2>
                
                <div class="w-28 h-[2px] bg-[#2b1b17] my-3 relative">
                    <span class="absolute left-1/2 -top-2 transform -translate-x-1/2 text-xs text-[#e87979]">♥</span>
                </div>

                <p class="retro-font text-base sm:text-lg text-[#2b1b17] mb-4 font-bold">
                    ¿Nos aceptarían una salida? 🥰
                </p>

                <!-- Enhanced Dancing Couple Illustration -->
                <div class="my-3 flex justify-center items-center bg-white/40 p-3 rounded-2xl border border-[#2b1b17]/10 shadow-inner w-full">
                    <svg class="w-44 h-32 text-[#2b1b17]" viewBox="0 0 200 150" fill="currentColor">
                        <line x1="25" y1="132" x2="175" y2="132" stroke="#2b1b17" stroke-width="2.5" stroke-linecap="round"/>
                        <text x="45" y="70" font-size="14">♪</text>
                        <text x="145" y="65" font-size="16">♫</text>
                        <text x="95" y="35" font-size="14">✨</text>
                        <path d="M85,128 L94,80 L80,70 L86,55 L93,60 L99,45 L110,55 L104,88 L112,128 Z" /> 
                        <circle cx="91" cy="38" r="6.5" />
                        <path d="M112,128 L122,90 L150,118 L138,128 Z" /> 
                        <path d="M108,58 L128,42 L134,53 L120,62 Z" /> 
                        <circle cx="130" cy="34" r="6.5" />
                        <path d="M55,108 Q68,90 60,78" stroke="#2b1b17" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <path d="M145,108 Q132,90 140,78" stroke="#2b1b17" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>

                <!-- Yes / No Buttons -->
                <div id="buttonContainer" class="flex items-center justify-center gap-6 mt-4 w-full relative h-16">
                    <button id="btnSi" onclick="handleYes()" class="bg-[#2b1b17] text-[#fcedec] px-8 py-3.5 rounded-full font-bold text-sm tracking-wider hover:bg-[#432c25] transition-all transform hover:scale-110 shadow-lg z-20 cursor-pointer">
                        ¡Sí! 💖
                    </button>
                    <button id="btnNo" onmouseover="moveNo()" ontouchstart="moveNo()" onclick="moveNo()" class="bg-[#e5a8ab] text-[#2b1b17] border-2 border-[#2b1b17] px-8 py-3.5 rounded-full font-bold text-sm tracking-wider transition-all shadow-md absolute right-2 sm:right-6 cursor-pointer">
                        No 🙈
                    </button>
                </div>
            </div>
        </div>

        <!-- SUCCESS MESSAGE SCREEN -->
        <div id="successCard" class="hidden bg-[#fff5f5] border-4 border-[#2b1b17] rounded-3xl p-6 sm:p-8 card-shadow text-center transition-all duration-700 bg-gradient-to-b from-[#fffaf9] to-[#fcedec]">
            <div class="text-5xl mb-2 animate-bounce">🎉🥰💖</div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-[#2b1b17] mb-2 tracking-tight">¡Sabíamos que aceptarían!</h2>
            <p class="retro-font text-xs sm:text-sm text-[#432c25] mb-4">Para coordinar la salida:</p>
            
            <div class="flex items-center justify-center gap-6 w-full mt-2">
                <!-- WhatsApp Icon Button 1 -->
                <a href="https://wa.me/593958623902?text=%C2%A1Hola!%20Aceptamos%20la%20salida%20%F0%9F%98%8A" target="_blank" class="w-14 h-14 bg-[#25D366] hover:bg-[#20ba5a] text-white rounded-full shadow-lg transition-all transform hover:scale-110 flex items-center justify-center cursor-pointer">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                </a>

                <!-- WhatsApp Icon Button 2 -->
                <a href="https://wa.me/593983377385?text=%C2%A1Hola!%20Aceptamos%20la%20salida%20%F0%9F%98%8A" target="_blank" class="w-14 h-14 bg-[#25D366] hover:bg-[#20ba5a] text-white rounded-full shadow-lg transition-all transform hover:scale-110 flex items-center justify-center cursor-pointer">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                </a>
            </div>
        </div>

    </div>

    <script>
        function showCard2() {
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');

            card1.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            setTimeout(() => {
                card1.classList.add('hidden');
                card2.classList.remove('hidden');
                setTimeout(() => {
                    card2.classList.remove('opacity-0', 'scale-95');
                    card2.classList.add('opacity-100', 'scale-100');
                }, 50);
            }, 500);
        }

        let noMoveCount = 0;
        function moveNo() {
            const btnNo = document.getElementById('btnNo');
            
            noMoveCount++;
            if (noMoveCount > 5) {
                btnNo.style.opacity = '0';
                btnNo.style.pointerEvents = 'none';
                return;
            }

            const randomX = (Math.random() - 0.5) * 150;
            const randomY = (Math.random() - 0.5) * 90;

            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function handleYes() {
            const card2 = document.getElementById('card2');
            const successCard = document.getElementById('successCard');

            card2.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                card2.classList.add('hidden');
                successCard.classList.remove('hidden');
                successCard.classList.add('opacity-100', 'scale-100');
            }, 500);
        }
    </script>

</body>
</html>
